name: skylinx_hrms
description: Skylinx HRMS — native mobile app.
publish_to: "none"
version: 1.2.4+11

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # networking
  dio: ^5.7.0

  # local storage (JWT token, prefs)
  shared_preferences: ^2.3.2

  # state management
  provider: ^6.1.2

  # date/number formatting
  intl: ^0.19.0

  # remote image display (avatars, profile photos)
  cached_network_image: ^3.4.1

  cupertino_icons: ^1.0.8

  # GPS for geo-fenced clock-in/out (geolocator's android module breaks our
  # AGP/Flutter toolchain via flutter.compileSdkVersion; location uses a fixed
  # compileSdk and builds cleanly)
  location: ^5.0.3

  # camera selfie capture for face-detection clock-in/out
  image_picker: ^1.1.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
