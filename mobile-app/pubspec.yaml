name: skylinx_hrms
description: Skylinx HRMS — native mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # networking
  dio: ^5.7.0

  # local storage (JWT token, prefs)
  shared_preferences: ^2.3.2

  # state management
  provider: ^6.1.2

  # date/number formatting
  intl: ^0.19.0

  # remote image display (avatars, profile photos)
  cached_network_image: ^3.4.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
