{% load i18n %}
<form hx-post="{% url 'user-group-assign' %}?group={{group_id}}" hx-target="#groupAssignBody"
    data-settings-native="true"
    method="POST"
    class="oh-profile-section">
    {{form.group.errors}}
    {{form.employee.errors}}
    {{form.employee}}
    <input type="hidden" name="group" value="{{group_id}}" id="{{group_id}}">
    <div class="d-flex flex-row-reverse">
        <button type="submit" class="oh-btn oh-btn--secondary mt-2 mr-0 pl-4 pr-5 oh-btn--w-100-resp">
            {% trans "Save" %}
        </button>
    </div>
</form>

<script>
  function initGroupAssignSelect2() {
    var el = document.querySelector('#groupAssignBody .oh-select2');
    if (el && !el.classList.contains('select2-initialized')) {
      el.classList.add('select2-initialized');
      if (typeof $ !== 'undefined' && $.fn.select2) {
        $(el).select2();
      }
    }
  }
  // Initialize on load (works with htmx 1.x inline script execution)
  initGroupAssignSelect2();
  // Also initialize on htmx swap (works with htmx 2.x) — guarded against duplicate listeners
  if (!window._groupAssignSelect2Bound) {
    window._groupAssignSelect2Bound = true;
    document.body.addEventListener('htmx:afterSwap', function(evt) {
      if (evt.detail && evt.detail.target && evt.detail.target.id === 'groupAssignBody') {
        setTimeout(initGroupAssignSelect2, 50);
      }
    });
  }
</script>
