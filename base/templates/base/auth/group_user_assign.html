{% load i18n %}
<form hx-post="{% url 'user-group-assign' %}?group={{group_id}}" hx-target="#groupAssignBody"
    data-settings-native="true"
    class="oh-profile-section">
    {{form.group.errors}}
    {{form.employee.errors}}
    {{form.employee}}
    <input type="hidden" name="group" value="{{group_id}}" id="{{group_id}}">
    <div class="d-flex flex-row-reverse">
        <button type="submit" class="oh-btn oh-btn--secondary mt-2 mr-0 pl-4 pr-5 oh-btn--w-100-resp">
            {% trans "Save" %}
        </button>
    </div>
</form>

<script>
  (function() {
    function initGroupAssignSelect2() {
      var el = $('#groupAssignBody .oh-select2');
      if (!el.length || typeof $ === 'undefined' || !$.fn.select2) return;
      // Destroy existing select2 instance first to prevent duplicate containers (fix #67bce92)
      if (el.data("select2")) {
        el.select2('destroy');
      }
      el.removeClass("select2-hidden-accessible");
      el.select2();
    }
    // Delay to allow htmx to finish DOM swap
    setTimeout(initGroupAssignSelect2, 100);
  })();
</script>
