{% load i18n %}
<div class="oh-wrapper">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="oh-main__titlebar-title fw-bold mb-0">{% trans "Announcements" %}</h1>
    {% if perms.base.add_announcement %}
      <button type="button" class="oh-btn oh-btn--secondary"
              hx-get="{% url 'create-announcement' %}"
              hx-target="#objectCreateModalTarget" hx-swap="innerHTML"
              data-toggle="oh-modal-toggle" data-target="#objectCreateModal">
        <ion-icon name="add-outline"></ion-icon> {% trans "New announcement" %}
      </button>
    {% endif %}
  </div>
  <div id="announcementListCard">
    {% include "announcement/announcements_list.html" %}
  </div>
</div>
