{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% trans "Legal Documents" %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, 'Segoe UI', sans-serif; background: #f4f6f9; color: #1f2937; }
    .ld-header { background: #13294a; color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 12px; }
    .ld-header h1 { font-size: 18px; margin: 0; font-weight: 700; }
    .ld-wrap { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
    .ld-list { background: #fff; border-radius: 10px; padding: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); height: fit-content; }
    .ld-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent;
      padding: 11px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #1f2937; }
    .ld-item:hover { background: #eef2ff; }
    .ld-item.active { background: #13294a; color: #fff; font-weight: 600; }
    .ld-item ion-icon, .ld-item .ic { color: #e76955; font-size: 18px; flex-shrink: 0; }
    .ld-item.active .ic { color: #fff; }
    .ld-viewer { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; min-height: 80vh; display: flex; flex-direction: column; }
    .ld-viewer__bar { padding: 10px 14px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    .ld-viewer__bar a { color: #2563eb; text-decoration: none; font-size: 13px; font-weight: 600; }
    .ld-viewer iframe { flex: 1; width: 100%; border: 0; min-height: 78vh; }
    .ld-empty { padding: 60px; text-align: center; color: #6b7280; }
    @media (max-width: 760px) { .ld-wrap { grid-template-columns: 1fr; } .ld-viewer iframe { min-height: 65vh; } }
  </style>
</head>
<body>
  <div class="ld-header">
    <span class="ic" style="font-size:22px;">📄</span>
    <h1>{% trans "Terms, Privacy & Legal Documents" %}</h1>
  </div>

  {% if docs %}
  <div class="ld-wrap">
    <div class="ld-list">
      {% for d in docs %}
        <button type="button" class="ld-item{% if forloop.first %} active{% endif %}"
                data-url="{{ d.file.url }}" onclick="showDoc(this)">
          <span class="ic">📄</span> {{ d.title }}
        </button>
      {% endfor %}
    </div>
    <div class="ld-viewer">
      <div class="ld-viewer__bar">
        <span id="ld-title">{{ docs.0.title }}</span>
        <a id="ld-open" href="{{ docs.0.file.url }}" target="_blank">{% trans "Open in new tab" %} ↗</a>
      </div>
      <iframe id="ld-frame" src="{{ docs.0.file.url }}#view=FitH"></iframe>
    </div>
  </div>
  <script>
    function showDoc(btn) {
      document.querySelectorAll('.ld-item').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var url = btn.getAttribute('data-url');
      document.getElementById('ld-frame').src = url + '#view=FitH';
      document.getElementById('ld-open').href = url;
      document.getElementById('ld-title').textContent = btn.textContent.trim();
    }
  </script>
  {% else %}
  <div class="ld-empty">{% trans "No legal documents have been published yet." %}</div>
  {% endif %}
</body>
</html>
