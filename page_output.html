<script>
    document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("themeToggleButton");
    if (!btn) return;

    btn.addEventListener("click", function (e) {
        e.preventDefault();

        fetch("/toggle-theme/", {
        method: "POST",
        headers: {
            "X-CSRFToken": "4i464IB5roTUmH89O3pxP8YClT9ELW1yrJnWLXqzNSQVhyHBaMR7pe6vt6AtPPpp",
            "X-Requested-With": "XMLHttpRequest"
        }
        })
        .then(response => {
        if (response.status === 204) {
            // Since server stored the new theme, we just mirror it in the UI

            const isDark = document.documentElement.classList.toggle("dark");
            document.body.classList.toggle("dark", isDark);

            const icon = btn.querySelector("i");
            if (icon) {
            icon.classList.toggle("fa-moon", !isDark);
            icon.classList.toggle("fa-lightbulb", isDark);
            }
        }
        })
        .catch(err => console.error(err));
    });
    });
</script>

<script>
function highlightRow(checkbox) {
    checkbox.closest(".oh-sticky-table__tr").removeClass("highlight-selected");
    checkbox.closest("tr").removeClass("highlight-selected");
    if (checkbox.is(":checked")) {
      checkbox.closest(".oh-sticky-table__tr").addClass("highlight-selected");
      checkbox.closest("tr").addClass("highlight-selected");
    }
  }

  function toggleHighlight(ids) {
    if (!ids.length > 0) return;
    $.each(ids, function (indexInArray, id) {
      setTimeout(() => {
        $(`#${id}`)
          .closest(".oh-sticky-table__tr")
          .removeClass("highlight-selected");
        if ($(`#${id}`).is(":checked")) {
          $(`#${id}`)
            .closest(".oh-sticky-table__tr")
            .addClass("highlight-selected");
        }
      }, 1);
    });
  }

function reloadSelectedCount(targetElement, storeKey = "selectedInstances") {
    var count = JSON.parse($(`#${storeKey}`).attr("data-ids") || "[]").length;
    id = targetElement.attr("id");
    if (id) {
        id = id.split("count_")[1];
    }
    if (count) {
        targetElement.html(count);
        targetElement.parent().removeClass("d-none");
        $(`#unselect_${id}, #export_${id}, #bulk_udate_${id}`).removeClass(
            "d-none"
        );
    } else {
        targetElement.parent().addClass("d-none");
        $(`#unselect_${id}, #export_${id}, #bulk_udate_${id}`).addClass(
            "d-none"
        );
    }
}

function removeHighlight() {
    setTimeout(function () {
        $(".toggle-highlight").removeClass("toggle-highlight");
    }, 200);
}

function removeId(element, storeKey = "selectedInstances") {
    id = element.val();
    viewId = element.attr("data-view-id");
    ids = JSON.parse($(`#${storeKey}`).attr("data-ids") || "[]");
    let elementToRemove = 5;
    if (ids[ids.length - 1] === id) {
        ids.pop();
    }
    ids = JSON.stringify(ids);
    $(`#${storeKey}`).attr("data-ids", ids);
}
</script>
<script>
  // Restore sidebar toggled state immediately to prevent layout flashes
  (function() {
    const sidebarToggled = localStorage.getItem('sidebarToggled');
    if (sidebarToggled === 'true') {
      document.body.classList.add('sidebar-toggled');
    } else if (sidebarToggled === 'false') {
      document.body.classList.remove('sidebar-toggled');
    }
  })();

  document.addEventListener("DOMContentLoaded", function () {
    window.toggleSidebar = function() {
      const body = document.body;
      const isToggled = body.classList.toggle('sidebar-toggled');
      localStorage.setItem('sidebarToggled', isToggled ? 'true' : 'false');
      if (!isToggled) {
        closeAll({ force: true });
        var shared = document.getElementById("sidebarSharedPanel");
        if (shared) {
          shared.classList.remove("sidebox-visible");
          shared.style.display = "";
        }
      } else {
        openLastActiveSubmenu();
      }
    };

    window.updateBackButtonVisibility = function() {
      const backBtn = document.getElementById("backButton");
      if (!backBtn) return;
      const currentPath = window.location.pathname;
      if (currentPath === '/' || currentPath === '/home/' || currentPath === '/base/home/') {
        backBtn.style.display = 'none';
      } else {
        backBtn.style.display = 'flex';
      }
    };

    // Initialize back button visibility
    updateBackButtonVisibility();
    /*
     * Delayed sidebar icon tooltip
     * - replaces instant native title tooltip
     * - shows after a short delay
     * - hides immediately on mouseleave/blur/scroll/mousedown
     */
    (function initDelayedSidebarTooltip() {
      var sidebar = document.getElementById("sidebar");
      if (!sidebar) return;

      var DELAY_MS = 550;
      var showTimer = null;
      var activeAnchor = null;

      var tip = document.createElement("div");
      tip.className = "oh-sidebar-delay-tooltip";
      tip.setAttribute("aria-hidden", "true");
      document.body.appendChild(tip);

      function getLabel(el) {
        if (!el) return "";
        return (
          el.getAttribute("data-tooltip") ||
          el.getAttribute("aria-label") ||
          el.getAttribute("title") ||
          ""
        ).trim();
      }

      /* Disable native instant title popups and keep the text in
         data-tooltip for our delayed tooltip renderer. */
      sidebar.querySelectorAll(".sideboxmain[title]").forEach(function (el) {
        var title = (el.getAttribute("title") || "").trim();
        if (title && !el.getAttribute("data-tooltip")) {
          el.setAttribute("data-tooltip", title);
        }
        el.removeAttribute("title");
      });

      function positionTip(anchor) {
        if (!anchor) return;
        var rect = anchor.getBoundingClientRect();
        var margin = 10;
        /* Place tooltip to the right of icon column. */
        tip.style.left = Math.round(rect.right + margin) + "px";
        tip.style.top = Math.round(rect.top + rect.height / 2) + "px";
        tip.style.transform = "translateY(-50%)";
      }

      function hideTip() {
        clearTimeout(showTimer);
        showTimer = null;
        activeAnchor = null;
        tip.classList.remove("is-visible");
      }

      function showTip(anchor) {
        var label = getLabel(anchor);
        if (!label) return;
        tip.textContent = label;
        positionTip(anchor);
        tip.classList.add("is-visible");
      }

      function scheduleShow(anchor) {
        clearTimeout(showTimer);
        activeAnchor = anchor;
        showTimer = setTimeout(function () {
          if (activeAnchor === anchor && anchor.matches(":hover")) {
            showTip(anchor);
          }
        }, DELAY_MS);
      }

      sidebar.addEventListener("mouseenter", function (e) {
        var anchor = e.target.closest(".sideboxmain");
        if (!anchor) return;
        scheduleShow(anchor);
      }, true);

      sidebar.addEventListener("mouseleave", function (e) {
        if (e.target.closest(".sideboxmain")) hideTip();
      }, true);

      sidebar.addEventListener("focusin", function (e) {
        var anchor = e.target.closest(".sideboxmain");
        if (!anchor) return;
        scheduleShow(anchor);
      });

      sidebar.addEventListener("focusout", function (e) {
        if (e.target.closest(".sideboxmain")) hideTip();
      });

      sidebar.addEventListener("mousedown", hideTip, true);
      sidebar.addEventListener("click", hideTip, true);
      window.addEventListener("scroll", hideTip, true);
      window.addEventListener("resize", hideTip);
    })();

    let lastUrlPath = window.location.pathname;

    function updateActiveMenuFromUrl() {
      const currentPath = window.location.pathname;
      if (currentPath !== lastUrlPath) {
        try { localStorage.removeItem("activeSubmenuDismissed"); }
        catch (_) {}
        lastUrlPath = currentPath;
      }

      if (currentPath === '/' || currentPath === '/home/' || currentPath === '/base/home/') {
        try { localStorage.removeItem("activeSidebarMenu"); }
        catch (_) {}
        document.querySelectorAll(".sideboxmain").forEach(el => el.classList.remove("active"));
        closeAll({ force: true });
        const homeBtn = document.querySelector('a.sideboxmain[data-menu="Home Page"]');
        if (homeBtn) homeBtn.classList.add("active");
        renderSubmodulesToolbar();
        return;
      }

      if (currentPath === '/dashboard/') {
        try { localStorage.removeItem("activeSidebarMenu"); }
        catch (_) {}
        document.querySelectorAll(".sideboxmain").forEach(el => el.classList.remove("active"));
        closeAll({ force: true });
        renderSubmodulesToolbar();
        return;
      }

      let matchedBtn = null;
      let bestBtnMatchLen = 0;
      document.querySelectorAll("button.sideboxmain").forEach(btn => {
        const links = btn.querySelectorAll(".sidebox-template ul li a");
        links.forEach(link => {
          const href = link.getAttribute("href") || link.getAttribute("hx-get");
          if (href) {
            try {
              const linkPath = new URL(href, window.location.origin).pathname;
              if (currentPath === linkPath) {
                matchedBtn = btn;
                bestBtnMatchLen = linkPath.length + 10000;
              } else if (linkPath !== '/' && currentPath.startsWith(linkPath)) {
                if (linkPath.length > bestBtnMatchLen) {
                  matchedBtn = btn;
                  bestBtnMatchLen = linkPath.length;
                }
              }
            } catch (_) {
              if (currentPath === href) {
                matchedBtn = btn;
                bestBtnMatchLen = href.length + 10000;
              } else if (href !== '/' && currentPath.startsWith(href)) {
                if (href.length > bestBtnMatchLen) {
                  matchedBtn = btn;
                  bestBtnMatchLen = href.length;
                }
              }
            }
          }
        });
      });

      if (matchedBtn) {
        const prevActive = localStorage.getItem("activeSidebarMenu");
        if (prevActive !== matchedBtn.dataset.menu) {
          try { localStorage.removeItem("activeSubmenuDismissed"); }
          catch (_) {}
        }
        setActiveSidebarMenu(matchedBtn);
      } else {
        // Clear active states if no sidebar button matches the current path
        document.querySelectorAll(".sideboxmain").forEach(el => el.classList.remove("active"));
        try { localStorage.removeItem("activeSidebarMenu"); }
        catch (_) {}
        closeAll({ force: true });
        renderSubmodulesToolbar();
      }
    }

    var ignoreCloseUntil = 0;

    function closeAll(opts) {
      /* Unified guard: during the brief window after a sidebar-initiated
         htmx request, suppress *any* attempt to close the panel. Even
         explicit callers (outside-click handler, stray events from the
         swap, etc.) will bail. Pass { force: true } to bypass the guard
         — only the navContainer toggle handler and Escape key do so. */
      if (!(opts && opts.force) && Date.now() < ignoreCloseUntil) return;
      document.querySelectorAll(".sideboxmain.sidebox-active").forEach(btn => {
        btn.classList.remove("sidebox-active");
        btn.setAttribute("aria-expanded", "false");
      });
      var shared = document.getElementById("sidebarSharedPanel");
      if (shared) shared.classList.remove("sidebox-visible");
    }

    function getHeaderBottom() {
      /* Return the y-coordinate just below the fixed navbar so the
         submenu panel never opens over it. Measured dynamically because
         the header height varies with screen size / content (breadcrumbs,
         alerts, etc.). Falls back to the CSS default (75px) if no header
         can be found. */
      var headerWrap = document.getElementById("header");
      var headerBar = headerWrap ? headerWrap.querySelector(".fixed") || headerWrap.firstElementChild : null;
      var el = headerBar || headerWrap;
      if (el) {
        var rect = el.getBoundingClientRect();
        if (rect && rect.height > 0) {
          return Math.ceil(rect.bottom) + 8; /* 8px breathing room */
        }
      }
      return 75;
    }

    function getSharedPanel() {
      return document.getElementById("sidebarSharedPanel");
    }

    function renderSharedPanelFromButton(btn) {
      var shared = getSharedPanel();
      if (!shared || !btn) return false;
      var menuKey = btn.getAttribute("data-menu") || "";
      if (
        shared.classList.contains("sidebox-visible") &&
        shared.getAttribute("data-current-menu") === menuKey
      ) {
        return true;
      }
      var template = btn.querySelector(".sidebox-template, :scope > .sidebox");
      if (!template) return false;
      var sourceTitle = template.querySelector("h5");
      var sourceList = template.querySelector("ul");
      var targetTitle = shared.querySelector("h5");
      var targetList = shared.querySelector("ul");
      if (!sourceTitle || !sourceList || !targetTitle || !targetList) return false;
      targetTitle.innerHTML = sourceTitle.innerHTML;
      targetList.innerHTML = sourceList.innerHTML;
      shared.setAttribute("data-current-menu", menuKey);
      shared.classList.add("sidebox-visible");
      return true;
    }

    function positionSidebox(btn) {
      const sidebox = getSharedPanel();
      if (!sidebox || !btn) return;
      const btnRect = btn.getBoundingClientRect();
      const viewportH = window.innerHeight;
      const headerBottom = getHeaderBottom();

      // Measure natural panel height while hidden
      sidebox.style.display = "block";
      const panelH = sidebox.scrollHeight;
      sidebox.style.display = "";

      // Align panel top with button top, but never above the navbar.
      // Then clamp to viewport (still respecting the navbar floor).
      let topPos = Math.max(btnRect.top, headerBottom);
      const maxTop = viewportH - panelH - 8;
      if (topPos > maxTop) topPos = Math.max(headerBottom, maxTop);
      sidebox.style.top = topPos + "px";

      // Cap panel height so it never spills below the viewport. The
      // inner <ul> already scrolls via the sidebar-scroll styling, so
      // long menus remain fully reachable.
      sidebox.style.maxHeight = (viewportH - topPos - 8) + "px";
      sidebox.style.overflowY = "auto";
    }

    function setActiveSidebarMenu(btn) {
      if (!btn) return;
      try {
        if (btn.dataset.menu) localStorage.setItem("activeSidebarMenu", btn.dataset.menu);
      } catch (_) { /* noop */ }
      document.querySelectorAll(".sideboxmain").forEach(el => el.classList.remove("active"));
      btn.classList.add("active");
      renderSubmodulesToolbar();
    }

    function renderSubmodulesToolbar() {
      const toolbar = document.getElementById("submodules-toolbar-links");
      const wrapper = document.getElementById("submodules-toolbar");
      const content = document.getElementById("ohMainContent");
      if (!toolbar || !wrapper || !content) return;

      const activeBtn = document.querySelector(".sideboxmain.active");
      if (!activeBtn || activeBtn.tagName.toLowerCase() === "a") {
        wrapper.style.display = "none";
        content.style.paddingTop = "96px";
        return;
      }

      const template = activeBtn.querySelector(".sidebox-template, :scope > .sidebox");
      if (!template) {
        wrapper.style.display = "none";
        content.style.paddingTop = "96px";
        return;
      }

      const links = template.querySelectorAll("ul li a");
      if (links.length === 0) {
        wrapper.style.display = "none";
        content.style.paddingTop = "96px";
        return;
      }

      wrapper.style.display = "flex";
      content.style.paddingTop = "135px";

      const currentPath = window.location.pathname;
      
      // Determine the best (longest matching or exact matching) submodule link to highlight
      let bestLink = null;
      let bestMatchLen = 0;
      links.forEach(link => {
        const href = link.getAttribute("href") || link.getAttribute("hx-get") || "#";
        if (currentPath === href) {
          bestLink = link;
          bestMatchLen = href.length + 10000;
        } else if (href !== '/' && currentPath.startsWith(href)) {
          if (href.length > bestMatchLen) {
            bestLink = link;
            bestMatchLen = href.length;
          }
        }
      });

      let html = "";
      links.forEach(link => {
        const href = link.getAttribute("href") || link.getAttribute("hx-get") || "#";
        const label = link.textContent.trim();
        const isCurrent = (link === bestLink);

        const activeClass = isCurrent 
          ? "submodule-tab-active font-semibold shadow-sm" 
          : "text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 hover:text-slate-900";

        html += `<a href="${href}" 
                    hx-get="${href}" 
                    hx-target="#ohMainContent" 
                    hx-select="#ohMainContent > *" 
                    hx-swap="innerHTML show:window:top" 
                    hx-push-url="true"
                    class="px-4 py-1.5 text-xs font-semibold rounded-full transition duration-150 whitespace-nowrap ${activeClass}">${label}</a>`;
      });
      toolbar.innerHTML = html;

      if (window.htmx) {
        htmx.process(toolbar);
      }
    }

    function openSidebarMenuButton(btn, opts) {
      if (!btn) return;
      if (!document.body.classList.contains("sidebar-toggled")) return;
      var options = opts || {};
      var keepCardOpen = !!options.keepCardOpen;
      var currentlyOpen = document.querySelector(".sideboxmain.sidebox-active");
      var sameButton = currentlyOpen === btn;

      if (sameButton) {
        if (options.isHover) {
          renderSharedPanelFromButton(btn);
          positionSidebox(btn);
          btn.classList.add("sidebox-active");
          btn.setAttribute("aria-expanded", "true");
          var shared = getSharedPanel();
          if (shared) shared.classList.add("sidebox-visible");
          return;
        }
        if (!options.isHover) {
          setActiveSidebarMenu(btn);
        }
        return;
      }

      if (keepCardOpen && currentlyOpen) {
        var sidebar = document.getElementById("sidebar");
        if (sidebar) sidebar.classList.add("sidebox-switching");
        renderSharedPanelFromButton(btn);
        positionSidebox(btn);
        btn.classList.add("sidebox-active");
        btn.setAttribute("aria-expanded", "true");
        currentlyOpen.classList.remove("sidebox-active");
        currentlyOpen.setAttribute("aria-expanded", "false");
        if (sidebar) {
          requestAnimationFrame(function () {
            sidebar.classList.remove("sidebox-switching");
          });
        }
      } else {
        closeAll({ force: true });
        renderSharedPanelFromButton(btn);
        positionSidebox(btn);
        btn.classList.add("sidebox-active");
        btn.setAttribute("aria-expanded", "true");
      }

      if (!options.isHover) {
        setActiveSidebarMenu(btn);
      }
    }

    // Single delegated listener on the nav scroll container
    const navContainer = document.querySelector("#sidebar nav");
    if (navContainer) {
      /*
       * Hard intercept for submenu anchors (capture phase).
       *
       * Why this exists: in some browsers/layout states, anchors nested
       * inside the absolute `.sidebox` can occasionally navigate before
       * the bubble-phase delegated handler runs, which looks like a full
       * page reload (observed on Payroll Dashboard clicks).
       *
       * Capture-phase interception guarantees we prevent default first,
       * then drive navigation ourselves (htmx swap or full fallback).
       */
      navContainer.addEventListener("click", function (e) {
        var link = e.target.closest(".sidebox a[href], .sidebox a[hx-get]");
        if (!link) return;
        var isLeftClick = !e.button || e.button === 0;
        var isModified = e.metaKey || e.ctrlKey || e.shiftKey || e.altKey;
        if (!isLeftClick || isModified) return;

        e.preventDefault();
        e.stopPropagation();
        if (typeof e.stopImmediatePropagation === "function") {
          e.stopImmediatePropagation();
        }

        var href = link.getAttribute("href") || link.getAttribute("hx-get") || "/";
        if (isStandaloneUrl(href)) {
          window.location.href = href;
          return;
        }

        var target = document.getElementById("ohMainContent");
        if (!target || !window.htmx) {
          window.location.href = href;
          return;
        }

        bumpGrace(1500);
        window.history.pushState({}, "", href);
        htmx.ajax("GET", href, {
          source: link,
          target: "#ohMainContent",
          select: "#ohMainContent > *",
          swap: "innerHTML show:window:top",
          headers: {"HX-Sidebar-Nav": "true"},
        });
      }, true);

      navContainer.addEventListener("click", function (e) {
        var link = e.target.closest("a");
        var isLeftClick = !e.button || e.button === 0;
        var isModified = e.metaKey || e.ctrlKey || e.shiftKey || e.altKey;

        /*
         * Deterministic sidebar navigation:
         * - Prevent default browser navigation for normal left-clicks.
         * - Route through htmx.ajax for layout-extending pages so we
         *   always swap only #ohMainContent (no full reload race).
         * - Fall back to full page navigation for standalone pages.
         */
        if (link && !isModified && isLeftClick) {
          var href = link.getAttribute("href") || link.getAttribute("hx-get");
          var isTopDashboard = link.matches("a.sideboxmain");
          var isSubmenuLink = !!link.closest(".sidebox");

          if (isTopDashboard || isSubmenuLink) {
            e.preventDefault();
            e.stopPropagation();

            if (isTopDashboard) {
              closeAll({ force: true });
              setActiveSidebarMenu(link);
            }

            if (isStandaloneUrl(href)) {
              window.location.href = href || "/";
              return;
            }

            var target = document.getElementById("ohMainContent");
            if (!target || !window.htmx) {
              window.location.href = href || "/";
              return;
            }

            bumpGrace(1500);
            window.history.pushState({}, "", href);
            htmx.ajax("GET", href, {
              source: link,
              target: "#ohMainContent",
              select: "#ohMainContent > *",
              swap: "innerHTML show:window:top",
              headers: {"HX-Sidebar-Nav": "true"},
            });
            return;
          }
        }

        /*
         * The `.sidebox` panel is rendered INSIDE the `.sideboxmain`
         * <button>, so any click within a panel (links, headers,
         * padding, gaps) bubbles up here with a `.sideboxmain`
         * ancestor. Bail out first so nothing we do below accidentally
         * closes the panel the user is trying to use.
         */
        if (e.target.closest(".sidebox")) return;

        /*
         * Top-level sidebar LINKS that have no submenu of their own —
         * currently just the Dashboard icon (top_menu.html). These are
         * <a class="sideboxmain"> elements sitting directly in the
         * sidebar column. Clicking one should:
         *   • close any submenu panel that was left open from another
         *     module,
         *   • update the active highlight,
         *   • let the normal navigation (htmx or classic) proceed.
         */
        var topLink = e.target.closest("a.sideboxmain");
        if (topLink) {
          closeAll({ force: true });
          document.querySelectorAll(".sideboxmain").forEach(el => el.classList.remove("active"));
          topLink.classList.add("active");
          if (topLink.dataset.menu) {
            try { localStorage.setItem("activeSidebarMenu", topLink.dataset.menu); }
            catch (_) { /* noop */ }
          }
          return;
        }

        /* Other links inside the nav (rare) – let them navigate untouched. */
        if (e.target.closest("a")) return;

        /* Finally, the standard sideboxmain BUTTON toggle. */
        const btn = e.target.closest(".sideboxmain");
        if (!btn) return;

        e.stopPropagation();

        if (btn.tagName.toLowerCase() === "a") {
          closeAll({ force: true });
          setActiveSidebarMenu(btn);
          try { localStorage.removeItem("activeSubmenuDismissed"); }
          catch (_) {}
          return;
        }

        // Clear dismissed state since user is explicitly clicking a menu
        try { localStorage.removeItem("activeSubmenuDismissed"); }
        catch (_) {}

        // Open the submenu first
        openSidebarMenuButton(btn, { keepCardOpen: true });

        // Navigate to the first submenu page
        const firstLink = btn.querySelector(".sidebox-template ul li a");
        if (firstLink) {
          firstLink.click();
        } else {
          // Fallback if no submenu items
          const isAlreadyOpen = btn.classList.contains("sidebox-active");
          if (isAlreadyOpen) {
            closeAll({ force: true });
            setActiveSidebarMenu(btn);
            try { localStorage.setItem("activeSubmenuDismissed", "true"); }
            catch (_) {}
          }
        }
      });
    }

    /*
     * Whenever a sidebar link fires an htmx request, extend the close
     * grace-window until the swap has settled. This covers every htmx
     * phase: beforeRequest sets the floor, afterSettle bumps it a bit
     * more so any focus/scroll/resize events triggered by the new
     * content don't synthesise a stray "outside click".
     */
    var sidebarEl = document.getElementById("sidebar");

    function bumpGrace(ms) {
      var until = Date.now() + ms;
      if (until > ignoreCloseUntil) ignoreCloseUntil = until;
    }

    /*
     * URL patterns whose responses are standalone pages (don't extend
     * the main index layout). When the user clicks a sidebar link whose
     * target matches one of these, we bail out of the htmx swap entirely
     * and do a classic full-page navigation — avoiding the wasted
     * network request and the brief flash of empty content that would
     * happen if we let htmx try to swap and then fall back post-response.
     *
     * Add new patterns here whenever a view renders a standalone HTML
     * document that does not extend the main index layout.
     */
    var STANDALONE_URL_PATTERNS = [
      /^\/recruitment\/open-recruitments\/?/i,
    ];
    function isStandaloneUrl(url) {
      if (!url) return false;
      try {
        var pathname = new URL(url, window.location.origin).pathname;
        return STANDALONE_URL_PATTERNS.some(function (rx) { return rx.test(pathname); });
      } catch (_) {
        return STANDALONE_URL_PATTERNS.some(function (rx) { return rx.test(url); });
      }
    }

    document.addEventListener("htmx:beforeRequest", function (evt) {
      try {
        var trigger = evt && evt.detail && evt.detail.elt;
        if (!(sidebarEl && trigger && sidebarEl.contains(trigger))) return;

        var requestPath =
          (evt.detail.pathInfo && evt.detail.pathInfo.requestPath) ||
          trigger.getAttribute("href") ||
          trigger.getAttribute("hx-get");
        if (isStandaloneUrl(requestPath)) {
          /* Cancel the htmx request before it goes out and hand over
             to the browser's own navigation. */
          if (evt.detail) evt.detail.shouldSwap = false;
          evt.preventDefault();
          if (evt.detail && evt.detail.xhr && typeof evt.detail.xhr.abort === "function") {
            try { evt.detail.xhr.abort(); } catch (_) { /* ignore */ }
          }
          window.location.href = requestPath;
          return;
        }

        bumpGrace(1500);
      } catch (_) { /* no-op */ }
    });
    document.addEventListener("htmx:afterSettle", function (evt) {
      /* tiny extension so the final post-swap click burst (if any) is
         still absorbed — harmless otherwise since the next user click
         will have moved past this window. */
      bumpGrace(200);

      updateActiveMenuFromUrl();
      openLastActiveSubmenu();
      updateBackButtonVisibility();

      /* Update breadcrumbs in the header from the sidebar navigation response.
         evt.detail.elt is the settled DOM node (not the sidebar link), so we
         identify sidebar navigations via the custom header in etc.headers.
         _crumbsUpdated prevents re-running when multiple elements settle. */
      var info = evt && evt.detail;
      if (!info || info._crumbsUpdated) return;
      var etc = info.etc;
      if (!etc || !etc.headers || etc.headers["HX-Sidebar-Nav"] !== "true") return;
      info._crumbsUpdated = true;
      var xhr = info.xhr;
      if (!xhr || !xhr.responseText) return;
      try {
        var parser = new DOMParser();
        var doc = parser.parseFromString(xhr.responseText, "text/html");
        var newCrumbs = doc.getElementById("breadcrumbs-container");
        var currentCrumbs = document.getElementById("breadcrumbs-container");
        if (newCrumbs && currentCrumbs) {
          currentCrumbs.innerHTML = newCrumbs.innerHTML;
        }
      } catch (_) { /* noop */ }
    });

    /*
     * Fallback to full navigation when a sidebar-initiated response
     * doesn't contain `#ohMainContent`. This happens when a view renders
     * a standalone template (e.g., recruitment/open_recruitments.html)
     * that does not extend the main index layout — in which case the
     * hx-select would produce an empty swap and the content region
     * would blank out. We detect that up-front and hand over to a
     * classic full page load so the user actually sees the page.
     */
    function shouldFallbackToFullNav(text) {
      /* A response is "standalone" (not an index.html extension) when
         it ships its own <!doctype> or <html> element but does NOT
         include our content container. In that case swapping would
         produce empty or garbage content, so we reload. */
      if (!text) return false;
      var hasOurContainer =
        text.indexOf('id="ohMainContent"') !== -1 ||
        text.indexOf("id='ohMainContent'") !== -1;
      if (hasOurContainer) return false;
      /* Any response that carries its own <html>/<body> indicates a
         full page. Even if it doesn't, the absence of ohMainContent
         means hx-select would produce nothing — safer to reload. */
      return true;
    }

    function fullNavigateFromEvent(evt) {
      var trigger = evt && evt.detail && evt.detail.elt;
      var dest =
        (evt.detail && evt.detail.pathInfo && evt.detail.pathInfo.requestPath) ||
        (trigger && trigger.getAttribute && trigger.getAttribute("href")) ||
        "/";
      window.location.href = dest;
    }

    document.addEventListener("htmx:beforeSwap", function (evt) {
      try {
        var trigger = evt && evt.detail && evt.detail.elt;
        if (!(sidebarEl && trigger && sidebarEl.contains(trigger))) return;
        var xhr = evt.detail.xhr;
        if (!xhr || xhr.status < 200 || xhr.status >= 400) return;
        if (!shouldFallbackToFullNav(xhr.responseText)) return;
        /* Belt-and-suspenders: htmx 1.x honours shouldSwap, 2.x uses
           preventDefault. Do both so the in-flight swap is cancelled
           regardless of the version shipped with the page. */
        if (evt.detail) evt.detail.shouldSwap = false;
        evt.preventDefault();
        fullNavigateFromEvent(evt);
      } catch (_) { /* fall through to htmx's default swap */ }
    });

    /*
     * Network / server errors on boosted sidebar clicks: fall back to
     * a full navigation so the user isn't stranded on a silent failure.
     */
    function sidebarNavError(evt) {
      try {
        var trigger = evt && evt.detail && evt.detail.elt;
        if (!(sidebarEl && trigger && sidebarEl.contains(trigger))) return;
        fullNavigateFromEvent(evt);
      } catch (_) { /* ignore */ }
    }
    document.addEventListener("htmx:responseError", sidebarNavError);
    document.addEventListener("htmx:sendError", sidebarNavError);
    document.addEventListener("htmx:timeout", sidebarNavError);
    /* If the swap target is missing on the current page (e.g. the user
       is currently on a standalone page like Open Jobs, then clicks
       Payroll Dashboard), htmx aborts silently. Without a fallback,
       the browser would then honor the link's href and do a full
       page reload. Redirect explicitly instead so the user lands on
       the intended destination with the proper layout. */
    document.addEventListener("htmx:targetError", sidebarNavError);

    /*
     * Browser back/forward: keep historyEnabled=true so hx-push-url can
     * update the browser URL, but remove HTMX's own window.onpopstate
     * handler so it never tries to restore from its sessionStorage cache
     * (which is stale/missing for programmatic htmx.ajax() calls).
     * Our plain reload below is always correct instead.
     */
    window.onpopstate = null;
    window.addEventListener("popstate", function () {
      window.location.reload();
    });

    /*
     * Outside-click close handler (capture phase so it runs before any
     * other listener can detach elements from the DOM). We rely on the
     * stable `#sidebar` wrapper rather than class-based `closest()`
     * lookups, which can return null if ancestors get re-parented during
     * a swap.
     *
     * Defense-in-depth — the panel stays open if ANY of these is true:
     *   1. The synthetic-event filter (e.isTrusted).
     *   2. The mousedown that started the click landed inside #sidebar.
     *      This is the most reliable signal because mousedown always
     *      reflects what the user physically pressed on, before any
     *      re-rendering.
     *   3. The click target itself is inside #sidebar.
     *   4. The ignoreCloseUntil grace window is active (inside closeAll).
     *
     * Only when ALL the "inside" signals are false and the grace window
     * has elapsed do we actually close the panel.
     */
    var lastMousedownInSidebar = false;
    document.addEventListener("mousedown", function (e) {
      var s = document.getElementById("sidebar");
      lastMousedownInSidebar = !!(s && s.contains(e.target));
    }, true);

    document.addEventListener("click", function (e) {
      if (!e.isTrusted) return;
      if (lastMousedownInSidebar) return;

      var s = document.getElementById("sidebar") || sidebarEl;
      if (s && s.contains(e.target)) return;

      // If sidebar is open, close it entirely
      if (document.body.classList.contains("sidebar-toggled")) {
        document.body.classList.remove("sidebar-toggled");
        localStorage.setItem('sidebarToggled', 'false');
        closeAll({ force: true });
      } else {
        closeAll();
      }
    }, true);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        if (document.body.classList.contains("sidebar-toggled")) {
          document.body.classList.remove("sidebar-toggled");
          localStorage.setItem('sidebarToggled', 'false');
        }
        closeAll({ force: true });
      }
    });

    /*
     * Stable behavior: keep panel open once user opens it, and only switch
     * panel content while hovering other icons. Avoid hover-driven
     * auto-close/auto-open because that can create close/open flicker.
     */
    var sidebarRoot = document.getElementById("sidebar");
    var hoverCloseTimer = null;
    var HOVER_CLOSE_DELAY = 180;

    function clearHoverCloseTimer() {
      if (!hoverCloseTimer) return;
      clearTimeout(hoverCloseTimer);
      hoverCloseTimer = null;
    }

    function scheduleCloseIfPointerLeavesSidebar(e) {
      if (!document.querySelector(".sideboxmain.sidebox-active")) return;
      var related = e && e.relatedTarget;
      if (related && sidebarRoot && sidebarRoot.contains(related)) return;
      clearHoverCloseTimer();
      hoverCloseTimer = setTimeout(function () {
        hoverCloseTimer = null;
        closeAll({ force: true });
      }, HOVER_CLOSE_DELAY);
    }

    function openLastActiveSubmenu() {
      if (!document.body.classList.contains("sidebar-toggled")) return;
      if (Date.now() < ignoreCloseUntil) return;
      if (document.querySelector(".sideboxmain.sidebox-active")) return;

      let dismissed = false;
      try { dismissed = localStorage.getItem("activeSubmenuDismissed") === "true"; }
      catch (_) {}
      if (dismissed) return;

      var lastMenu = null;
      try { lastMenu = localStorage.getItem("activeSidebarMenu"); }
      catch (_) { /* noop */ }
      if (!lastMenu) return;
      var btn = document.querySelector(
        '.sideboxmain[data-menu="' + lastMenu.replace(/"/g, '\\"') + '"]'
      );
      if (!btn || btn.classList.contains("sidebox-active")) return;

      renderSharedPanelFromButton(btn);
      positionSidebox(btn);

      btn.classList.add("sidebox-active");
      btn.setAttribute("aria-expanded", "true");
      document
        .querySelectorAll(".sideboxmain")
        .forEach(function (el) { el.classList.remove("active"); });
      btn.classList.add("active");
    }

    if (sidebarRoot) {
      /*
       * If a submenu card is already open, hovering another icon should
       * replace only the menu list while keeping the card visible.
       */
      sidebarRoot.addEventListener("mouseenter", function (e) {
        var btn = e.target && e.target.closest && e.target.closest(".sideboxmain");
        if (!btn || !btn.querySelector(".sidebox")) return;
        var openBtn = document.querySelector(".sideboxmain.sidebox-active");
        if (!openBtn) {
          clearHoverCloseTimer();
          openSidebarMenuButton(btn, { keepCardOpen: false, isHover: true });
          return;
        }
        if (openBtn === btn) return;
        clearHoverCloseTimer();
        openSidebarMenuButton(btn, { keepCardOpen: true, isHover: true });
      }, true);

      sidebarRoot.addEventListener("mousemove", clearHoverCloseTimer, true);
      sidebarRoot.addEventListener("mouseleave", scheduleCloseIfPointerLeavesSidebar, true);

      // Reopen last active submenu when mouse enters the sidebar
      sidebarRoot.addEventListener("mouseenter", function () {
        if (!document.body.classList.contains("sidebar-toggled")) return;
        clearHoverCloseTimer();
        openLastActiveSubmenu();
      });
    }

    // Intercept submodule toolbar clicks for robust programmatic HTMX navigation and sync
    const toolbarLinksContainer = document.getElementById("submodules-toolbar-links");
    if (toolbarLinksContainer) {
      toolbarLinksContainer.addEventListener("click", function (e) {
        var link = e.target.closest("a[href], a[hx-get]");
        if (!link) return;
        var isLeftClick = !e.button || e.button === 0;
        var isModified = e.metaKey || e.ctrlKey || e.shiftKey || e.altKey;
        if (!isLeftClick || isModified) return;

        e.preventDefault();
        e.stopPropagation();

        var href = link.getAttribute("href") || link.getAttribute("hx-get") || "/";
        if (isStandaloneUrl(href)) {
          window.location.href = href;
          return;
        }

        var target = document.getElementById("ohMainContent");
        if (!target || !window.htmx) {
          window.location.href = href;
          return;
        }

        bumpGrace(1500);
        window.history.pushState({}, "", href);

function isChartEmpty(chart) {
    return chart.data.datasets.every(dataset => {
        if (Array.isArray(dataset.data)) {
            return dataset.data.every(value => !value || value === 0);
        } else if (typeof dataset.data === 'object') {
            return Object.values(dataset.data).every(value => !value || value === 0);
        }
        return true;
    });
}

function showEmptyState(chart, message = "No records available at the moment") {
    const $canvas = $(chart.canvas);
    const chartId = $canvas.attr("id");

    // Hide canvas wrapper
    $canvas.closest(".relative").hide();

    if ($("#no-data-" + chartId).length === 0) {
        const emptyHTML = `
      <div id="no-data-${chartId}" class="h-[350px] flex items-center justify-center">
        <div class="flex flex-col items-center justify-center">
          <img src="/static/skylinx_theme/assets/img/no-records.svg" alt="" width="300" class="mb-4">
          <p class="text-[#666] mb-5">${message}</p>
        </div>
      </div>
    `;
        $canvas.closest(".relative").after(emptyHTML);
    } else {
        $("#no-data-" + chartId).show();
    }
}

function hideEmptyState(chart) {
    const $canvas = $(chart.canvas);
    const chartId = $canvas.attr("id");

    // Show canvas wrapper
    $canvas.closest(".relative").show();
    $("#no-data-" + chartId).hide();
}

function emptyChart(chart) {
    if (!chart) return;

    if (isChartEmpty(chart)) {
        showEmptyState(chart);
    } else {
        hideEmptyState(chart);
    }
}

<script>
    var at_work_seconds = $(".at_work_seconds").data("at-work-seconds");
    var run = $(".at_work_seconds").data("run");
    var whiteLabelCompany = $("#whiteLabelCompany").data("company");

    // time-runner
    function secondsToDuration(seconds) {
        if (seconds < 0){
            seconds = 0
        }
        var hours = Math.floor(seconds / 3600);
        var minutes = Math.floor((seconds % 3600) / 60);
        var remainingSeconds = Math.floor(seconds % 60);

        var formattedHours = (hours < 10) ? "0" + hours : hours;
        var formattedMinutes = (minutes < 10) ? "0" + minutes : minutes;
        var formattedSeconds = (remainingSeconds < 10) ? "0" + remainingSeconds : remainingSeconds;

        return formattedHours + ":" + formattedMinutes + ":" + formattedSeconds;
    }

    if (window.timeRunnerInterval) {
        clearInterval(window.timeRunnerInterval);
    }

    $(".time-runner").not("title").html(secondsToDuration(at_work_seconds));
    $("title.time-runner").html(` ${whiteLabelCompany} | ` + secondsToDuration(at_work_seconds));

    if (run) {
        window.timeRunnerInterval = setInterval(() => {
            at_work_seconds = parseInt(at_work_seconds) + 1;
            $("div.time-runner").html(secondsToDuration(at_work_seconds));
            $("title").html(` ${whiteLabelCompany} | ` + secondsToDuration(at_work_seconds));
        }, 1000);
    }
</script>

<script>
    var staticUrl = $("#statiUrl").attr("data-url");
    var notification_sound = false;
    function fill_notification_badge(data) {
        var badges = document.getElementsByClassName(notify_badge_class);
        let previousUnreadCount = parseInt(localStorage.getItem('previousUnreadCount')) || 0;
        if (notification_sound) {
            if (
                previousUnreadCount !== null &&
                previousUnreadCount < data.unread_count
            ) {
                const audio = new Audio(
                    `${staticUrl}static/audio/notification-sound.wav`
                );
                audio.play();
            }
        }

        if (badges) {
            for (var i = 0; i < badges.length; i++) {
                badges[i].innerHTML = data.unread_count;
            }
        }
        localStorage.setItem('previousUnreadCount', data.unread_count);
    }
    function markAsRead(notificationId) {
        fetch("/notifications/mark-as-read/" + notificationId + "/").then(
            (response) => {
                if (response.ok) {
                    // Reload the page to update the notifications
                    location.reload();
                } else {
                    console.error("Failed to mark notification as read");
                }
            }
        );
    }

    $("#viewallnotification").click(function () {
        $("#showallnotificationbtn").toggle();
    });

    function toggleNotificationIcon($el) {
        const $icon = $el.find(".material-symbols-outlined");
        if ($icon.length) {
            const current = $icon.text().trim();
            $icon.text(current === "volume_up" ? "volume_off" : "volume_up");
        }
    }

    function markNotificationAndRedirect(element) {
        var notificationLink = $(element);
        var notificationId = notificationLink.data("id");

        $.ajax({
            type: "POST",
            url: "/mark-as-read-notification-json/",
            data: {
                csrfmiddlewaretoken: getCookie("csrftoken"),
                notification_id: notificationId,
            },
            success: function (response) {
                // Redirect in all cases
                window.location.href = notificationLink.attr("href");

                if (!response.success) {
                    console.error("Failed to mark notification as read");
                    if (response.error) {
                        console.error("Error:", response.error);
                    }
                }
            },
            error: function (xhr, status, error) {
                window.location.href = notificationLink.attr("href");
                console.error("Error:", status, error);
            },
        });
    }

</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  (function () {
    var input   = document.getElementById("hpSearchInput");
    var results = document.getElementById("hpSearchResults");
    var wrap    = document.getElementById("hpSearchWrap");
    if (!input || !results || !wrap) return;

    var timer   = null;
    var cursor  = -1;

    /* Icon map for search results */
    var ICONS = {
      person:     '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      dashboard:  '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
      people:     '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',
      attendance: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      leave:      '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
      payroll:    '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>',
      hiring:     '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
      onboarding: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>',
      assets:     '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
      support:    '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>',
      pms:        '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
      projects:   '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 4 12 14.01 9 11.01"/><line x1="2" y1="2" x2="22" y2="2"/></svg>',
      exit:       '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
      insights:   '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
      settings:   '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    };

    var BG = { person:"#eff6ff", feature:"#f5f3ff" };
    var FG = { person:"#3b82f6", feature:"#8b5cf6" };

    function getIconHtml(item) {
      if (item.type === "employee" && item.avatar) {
        return '<img src="' + item.avatar + '" alt="" />';
      }
      var key = item.type === "employee" ? "person" : (item.icon || "dashboard");
      var ic = ICONS[key] || ICONS["dashboard"];
      return '<span style="color:' + (item.type==="employee"?"#3b82f6":"#8b5cf6") + '">' + ic + '</span>';
    }

    function renderResults(data) {
      cursor = -1;
      if (!data.results || data.results.length === 0) {
        results.innerHTML = '<div class="hp-sr-empty">No results found for "<strong>' + escHtml(input.value) + '</strong>"</div>';
        results.classList.add("visible");
        return;
      }

      var html = "";
      var lastType = null;
      data.results.forEach(function(item, i) {
        if (item.type !== lastType) {
          html += '<div class="hp-sr-divider">' + (item.type === "employee" ? "Employees" : "Features & Pages") + '</div>';
          lastType = item.type;
        }
        var bg = item.type === "employee" ? "#eff6ff" : "#f5f3ff";
        html += '<a class="hp-sr-item" href="' + item.url + '" data-index="' + i + '" role="option">'
              + '  <span class="hp-sr-avatar" style="background:' + bg + '">' + getIconHtml(item) + '</span>'
              + '  <span><div class="hp-sr-label">' + escHtml(item.label) + '</div>'
              + '       <div class="hp-sr-sub">'  + escHtml(item.sub)   + '</div></span>'
              + '  <span class="hp-sr-badge ' + item.type + '">' + (item.type === "employee" ? "Employee" : "Page") + '</span>'
              + '</a>';
      });
      results.innerHTML = html;
      results.classList.add("visible");

      /* htmx navigate for feature/employee links */
      results.querySelectorAll("a.hp-sr-item").forEach(function(a) {
        a.addEventListener("click", function(e) {
          var href = a.getAttribute("href");
          if (href && window.htmx) {
            e.preventDefault();
            var target = document.getElementById("ohMainContent");
            if (target) {
              window.history.pushState({}, "", href);
              htmx.ajax("GET", href, { target:"#ohMainContent", select:"#ohMainContent > *", swap:"innerHTML show:window:top" });
            } else { window.location.href = href; }
          }
          hideResults();
        });
      });
    }

    function escHtml(s) {
      return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function hideResults() {
      results.classList.remove("visible");
      results.innerHTML = "";
      cursor = -1;
    }

    function doSearch(q) {
      if (!q || q.length < 2) { hideResults(); return; }
      results.innerHTML = '<div class="hp-sr-loading">Searching...</div>';
      results.classList.add("visible");
      fetch("/global-search/?q=" + encodeURIComponent(q), {
        headers: { "X-Requested-With": "XMLHttpRequest" }
      }).then(function(r){ return r.json(); })
        .then(renderResults)
        .catch(function(){ hideResults(); });
    }

    input.addEventListener("input", function() {
      clearTimeout(timer);
      var q = input.value.trim();
      if (q.length < 2) { hideResults(); return; }
      timer = setTimeout(function(){ doSearch(q); }, 280);
    });

    input.addEventListener("keydown", function(e) {
      var items = results.querySelectorAll("a.hp-sr-item");
      if (!items.length) return;
      if (e.key === "ArrowDown")  { e.preventDefault(); cursor = Math.min(cursor+1, items.length-1); highlight(items); }
      else if (e.key === "ArrowUp")   { e.preventDefault(); cursor = Math.max(cursor-1, -1); highlight(items); }
      else if (e.key === "Enter" && cursor >= 0) { e.preventDefault(); items[cursor].click(); }
      else if (e.key === "Escape") { hideResults(); input.blur(); }
    });

    function highlight(items) {
      items.forEach(function(el,i){ el.classList.toggle("active", i===cursor); });
      if (cursor >= 0) items[cursor].scrollIntoView({ block:"nearest" });
    }

    document.addEventListener("click", function(e) {
      if (!wrap.contains(e.target)) hideResults();
    });

    /* Ctrl+K shortcut */
    document.addEventListener("keydown", function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        input.focus();
        input.select();
      }
    });
  })();
});
