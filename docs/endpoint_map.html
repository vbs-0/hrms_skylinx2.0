<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Emplinx Endpoint Map</title>
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f1f5f9;color:#0f172a}
header{position:sticky;top:0;background:#0f172a;color:#fff;padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;z-index:10}
header h1{font-size:16px;margin:0 24px 0 0}
#q{flex:1;min-width:260px;padding:10px 14px;border-radius:8px;border:none;font-size:14px}
#stats{font-size:12px;opacity:.8}
.appbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 24px;background:#e2e8f0;position:sticky;top:58px;z-index:9}
.appbtn{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.appbtn.on{background:#0f172a;color:#fff}
main{padding:16px 24px}
.grp{background:#fff;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.grp h2{margin:0;padding:12px 18px;font-size:14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;cursor:pointer;display:flex;justify-content:space-between}
.grp h2 .n{color:#64748b;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:6px 18px;border-top:1px solid #f1f5f9;vertical-align:top}
td.u{font-family:ui-monospace,monospace;color:#1d4ed8;width:42%}
td.nm{color:#334155;width:18%}
td.v{font-family:ui-monospace,monospace;color:#64748b}
mark{background:#fde68a;padding:0}
.hid{display:none}
</style></head><body>

const byApp = {};
DATA.forEach(r => { (byApp[r.app || "other"] = byApp[r.app || "other"] || []).push(r); });
const appNames = Object.keys(byApp).sort((a,b)=>byApp[b].length-byApp[a].length);
let activeApps = new Set(appNames);

const bar = document.getElementById("appbar");
appNames.forEach(a => {
  const b = document.createElement("button");
  b.className = "appbtn on"; b.textContent = a + " (" + byApp[a].length + ")";
  b.onclick = () => {
    if (activeApps.size === appNames.length) { activeApps = new Set([a]); }
    else if (activeApps.has(a)) { activeApps.delete(a); if(!activeApps.size) activeApps = new Set(appNames); }
    else activeApps.add(a);
    document.querySelectorAll(".appbtn").forEach((el,i)=>el.classList.toggle("on", activeApps.has(appNames[i])));
    render();
  };
  bar.appendChild(b);
});

const main = document.getElementById("main");
const q = document.getElementById("q");
q.addEventListener("input", render);

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function hi(s, needle){
  if(!needle) return esc(s);
  const i = s.toLowerCase().indexOf(needle);
  if(i<0) return esc(s);
  return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i,i+needle.length)) + "</mark>" + esc(s.slice(i+needle.length));
}
function render(){
  const needle = q.value.trim().toLowerCase();
  let shown = 0, html = "";
  appNames.forEach(a => {
    if(!activeApps.has(a)) return;
    const rows = byApp[a].filter(r => !needle || (r.url+" "+r.name+" "+r.view).toLowerCase().includes(needle));
    if(!rows.length) return;
    shown += rows.length;
    html += '<div class="grp"><h2>'+a+' <span class="n">'+rows.length+' endpoints</span></h2><table>';
    rows.forEach(r => {
      html += "<tr><td class='u'>"+hi(r.url,needle)+"</td><td class='nm'>"+hi(r.name,needle)+"</td><td class='v'>"+hi(r.view,needle)+"</td></tr>";
    });
    html += "</table></div>";
  });
  main.innerHTML = html || "<p style='color:#64748b'>No matches.</p>";
  document.getElementById("stats").textContent = shown + " / " + DATA.length + " endpoints";
}
render();
