<form hx-post="{% url 'geo-config' %}" hx-swap="none" hx-on-htmx-after-request="$('#reloadMessagesButton').click();">
    {% csrf_token %}
    {{form.as_p}}
    
    <div class="mt-2">
        <button type="button" id="get-location-btn" class="oh-btn oh-btn--info">
            <span class="oh-btn__icon"><i class="fa fa-map-marker-alt"></i></span>
            Get My Current Location
        </button>
    </div>
</form>

<script>
    (function() {
        const btn = document.getElementById('get-location-btn');
        if (!btn) return;
        btn.addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const latInput = document.getElementById('id_latitude');
                        const lonInput = document.getElementById('id_longitude');
                        if (latInput && lonInput) {
                            latInput.value = position.coords.latitude;
                            lonInput.value = position.coords.longitude;
                            alert("Location retrieved successfully!");
                        } else {
                            alert("Latitude and Longitude input fields not found in the form.");
                        }
                    },
                    function(error) {
                        let msg = "Failed to retrieve location: ";
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                msg += "User denied the request for Geolocation.";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                msg += "Location information is unavailable.";
                                break;
                            case error.TIMEOUT:
                                msg += "The request to get user location timed out.";
                                break;
                            case error.UNKNOWN_ERROR:
                                msg += "An unknown error occurred.";
                                break;
                        }
                        alert(msg);
                    }
                );
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        });
    })();
</script>
