{% extends 'index.html' %}
{% load i18n %}
{% block content %}
<div class="oh-wrapper" style="padding: 24px;">
    <div style="background:#ffffff; border-radius:16px; padding:24px; border:1px solid rgba(128,128,128,0.09); box-shadow:0 1px 4px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.05);">
        <div style="margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center;">
            <h1 style="font-size:24px; font-weight:800; margin:0;">{% trans "Holiday Calendar" %}</h1>
            {% if perms.base.view_holidays %}
            <a href="{% url 'holiday-view' %}" class="oh-btn oh-btn--secondary">
                {% trans "Manage Holidays" %}
            </a>
            {% endif %}
        </div>
        
        <!-- Render the fragment directly here on first load -->
        {% include 'holiday_calendar_fragment.html' %}
    </div>
</div>
{% endblock %}
