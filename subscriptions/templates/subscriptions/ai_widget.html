{% load i18n static %}
<style>
  /* Dark mode for the assistant widget — the markup uses inline light
     styles, so these need !important to win. */
  .dark #ai-panel { background: #1e293b !important; }
  .dark #ai-msgs,
  .dark #support-new,
  .dark #support-msgs { background: #0f172a !important; color: #cbd5e1; }
  .dark #ai-panel .ai-tab-btn { background: #1e293b !important; color: #cbd5e1; }
  .dark #ai-panel .ai-tab-btn[style*="background:#f8fafc"] { background: #0f172a !important; }
  .dark #ai-panel div[style*="border-bottom:1px solid #e2e8f0"],
  .dark #ai-panel div[style*="border-top:1px solid #e2e8f0"] { border-color: #334155 !important; }
  .dark #ai-input,
  .dark #support-subject,
  .dark #support-message,
  .dark #support-reply-input {
    background: #0f172a !important; color: #e2e8f0 !important; border-color: #334155 !important;
  }
  .dark #support-thread-subject { color: #f1f5f9 !important; }
  .dark #support-new p { color: #94a3b8 !important; }
</style>
<div id="ai-fab" title="{% trans 'Ask Emplinx Assistant' %}"
     style="position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;
            background:#4f46e5;display:flex;align-items:center;justify-content:center;
            cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,.4);z-index:9998;overflow:hidden;">
  <img src="{% static 'skylinx_theme/assets/img/ai_bot.png' %}" alt="AI"
       style="width:100%;height:100%;object-fit:cover;pointer-events:none;"></div>

<div id="ai-panel"
     style="display:none;position:fixed;bottom:92px;right:24px;width:340px;max-width:calc(100vw - 48px);
            height:460px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);
            z-index:9999;flex-direction:column;overflow:hidden;font-family:Inter,sans-serif;">
  <div style="background:#4f46e5;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
    <div style="font-weight:600;font-size:14px;" id="ai-panel-title">{% trans "Emplinx Assistant" %}</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="ai-clear" title="{% trans 'Clear conversation' %}" style="cursor:pointer;font-size:12px;opacity:.85;">{% trans "Clear" %}</span>
      <span id="ai-close" style="cursor:pointer;font-size:18px;">×</span>
    </div>
  </div>
  {% if ai_widget_visible and support_widget_visible %}
  <div style="display:flex;border-bottom:1px solid #e2e8f0;">
    <button type="button" id="tab-assistant" class="ai-tab-btn" style="flex:1;padding:8px;border:none;background:#f8fafc;cursor:pointer;font-weight:600;font-size:12.5px;">{% trans "Assistant" %}</button>
    <button type="button" id="tab-support" class="ai-tab-btn" style="flex:1;padding:8px;border:none;background:#fff;cursor:pointer;font-size:12.5px;">{% trans "Support" %}</button>
  </div>
  {% endif %}
  <div id="ai-chat-pane" style="display:flex;flex-direction:column;flex:1;overflow:hidden;{% if not ai_widget_visible %}display:none;{% endif %}">
    <div id="ai-msgs" style="flex:1;overflow-y:auto;padding:12px;font-size:13px;background:#f8fafc;">
    </div>
    <div style="display:flex;border-top:1px solid #e2e8f0;padding:8px;gap:6px;">
      <input id="ai-input" placeholder="{% trans 'Type your question...' %}"
             style="flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;">
      <button id="ai-send" style="background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:0 14px;cursor:pointer;">➤</button>
    </div>
  </div>
  <div id="support-pane" style="display:{% if ai_widget_visible %}none{% else %}flex{% endif %};flex-direction:column;flex:1;overflow:hidden;">
    <div id="support-new" style="display:flex;flex-direction:column;flex:1;overflow-y:auto;padding:14px;font-size:13px;background:#f8fafc;">
      <div id="support-history" style="margin-bottom:12px;"></div>
      <p style="color:#64748b;font-size:12.5px;margin-bottom:10px;">{% trans "Trouble with something? Send us a message — we'll get back to you by email." %}</p>
      <input id="support-subject" placeholder="{% trans 'Subject' %}"
             style="border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;margin-bottom:8px;">
      <textarea id="support-message" placeholder="{% trans 'Describe the issue...' %}" rows="6"
                style="border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;resize:vertical;margin-bottom:8px;"></textarea>
      <button id="support-send" style="background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:9px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;">
        <span id="support-send-spinner" style="display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sup-spin .7s linear infinite;"></span>
        <span id="support-send-label">{% trans "Send to Support" %}</span>
      </button>
      <div id="support-status" style="margin-top:8px;font-size:12.5px;"></div>
      <style>@keyframes sup-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <div id="support-thread" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #e2e8f0;">
        <strong id="support-thread-subject" style="font-size:12.5px;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></strong>
        <span id="support-new-ticket-link" style="cursor:pointer;color:#4f46e5;font-size:12px;white-space:nowrap;margin-left:8px;">{% trans "New ticket" %}</span>
      </div>
      <div id="support-msgs" style="flex:1;overflow-y:auto;padding:12px;background:#f8fafc;"></div>
      <div style="display:flex;border-top:1px solid #e2e8f0;padding:8px;gap:6px;">
        <input id="support-reply-input" placeholder="{% trans 'Reply...' %}"
               style="flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;">
        <button id="support-reply-send" style="background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:0 14px;cursor:pointer;">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var fab=document.getElementById('ai-fab'),panel=document.getElementById('ai-panel'),
      close=document.getElementById('ai-close'),msgs=document.getElementById('ai-msgs'),
      input=document.getElementById('ai-input'),send=document.getElementById('ai-send'),busy=false;
  // sessionStorage: survives page navigation within Emplinx, clears on tab close — never sent anywhere but this browser tab.
  function csrf(){var m=document.cookie.match(/csrftoken=([^;]+)/);return m?m[1]:'';}
  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  // Minimal, safe markdown-lite renderer: escape everything first, then turn
  // **bold**/*italic*/`code` into tags so the assistant's replies don't show
  // literal asterisks/backticks in the bubble.
  function renderMd(text){
    var h=escapeHtml(text);
    h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
    h=h.replace(/(^|\s)\*([^\s*][^*]*?)\*(?=$|\s)/g,'$1<em>$2</em>');
    return h;
  }
  function bubble(text,me){
    var d=document.createElement('div');
    d.style.cssText='border-radius:10px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap;'+
      (me?'background:#4f46e5;color:#fff;margin-left:40px;':'background:#fff;border:1px solid #e2e8f0;color:#0f172a;margin-right:20px;');
    if(me){d.textContent=text;}else{d.innerHTML=renderMd(text);}
    msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;
  }
  // Consequential (execute-tier) actions never run on the turn the model
  // proposes them — this card is the only way one actually happens.
  function confirmCard(pendingAction){
    var wrap=document.createElement('div');
    wrap.style.cssText='border:1px solid #f59e0b;background:#fffbeb;border-radius:10px;padding:10px;margin-bottom:8px;margin-right:20px;font-size:12.5px;color:#78350f;';
    var summary=document.createElement('div');
    summary.style.cssText='margin-bottom:8px;white-space:pre-wrap;';
    summary.textContent=pendingAction.summary||'Confirm this action?';
    var row=document.createElement('div');
    row.style.cssText='display:flex;gap:8px;';
    var proceed=document.createElement('button');
    proceed.textContent='Proceed';
    proceed.style.cssText='background:#16a34a;color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px;';
    var cancel=document.createElement('button');
    cancel.textContent='Cancel';
    cancel.style.cssText='background:#e5e7eb;color:#111827;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px;';
    row.appendChild(proceed);row.appendChild(cancel);
    wrap.appendChild(summary);wrap.appendChild(row);
    msgs.appendChild(wrap);msgs.scrollTop=msgs.scrollHeight;
    cancel.onclick=function(){
      wrap.remove();
      var msg='Cancelled — nothing was changed.';
      bubble(msg,false);saveMsg(msg,false);
    };
    proceed.onclick=function(){
      proceed.disabled=true;cancel.disabled=true;proceed.textContent='Working…';
      fetch('/manage/ai-chat/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({confirm_action:pendingAction})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
        .then(function(res){
          wrap.remove();
          var reply=res.ok?res.j.reply:(res.j.error||'Something went wrong.');
          var b=bubble(reply,false);saveMsg(reply,false);
        })
        .catch(function(){wrap.remove();var msg='Could not reach the assistant to confirm.';bubble(msg,false);saveMsg(msg,false);});
    };
  }
  // sessionStorage: survives page navigation within Emplinx, clears when the tab closes — never sent anywhere but this browser tab.
  var GREETING="{% trans 'Hi! Ask me about your leave balance, shifts, payslips, or how to use Emplinx.' %}";
  var MAX_AGE=8*60*60*1000; // auto-expire the conversation after 8 hours
  var history=[],msgHistory=[];
  var ts=parseInt(sessionStorage.getItem('ai_ts')||'0',10);
  if(ts&&(Date.now()-ts)>MAX_AGE){sessionStorage.removeItem('ai_history');sessionStorage.removeItem('ai_msgs');sessionStorage.removeItem('ai_ts');}
  try{history=JSON.parse(sessionStorage.getItem('ai_history')||'[]');}catch(e){history=[];}
  try{msgHistory=JSON.parse(sessionStorage.getItem('ai_msgs')||'[]');}catch(e){msgHistory=[];}
  if(msgHistory.length){msgHistory.forEach(function(m){bubble(m.text,m.me);});}
  else{bubble(GREETING,false);}
  function saveMsg(text,me){
    msgHistory.push({text:text,me:me});if(msgHistory.length>40)msgHistory=msgHistory.slice(-40);
    sessionStorage.setItem('ai_msgs',JSON.stringify(msgHistory));
    sessionStorage.setItem('ai_ts',String(Date.now()));
  }
  function clearChat(){
    history=[];msgHistory=[];
    sessionStorage.removeItem('ai_history');sessionStorage.removeItem('ai_msgs');sessionStorage.removeItem('ai_ts');
    msgs.innerHTML='';bubble(GREETING,false);
  }
  document.getElementById('ai-clear').onclick=clearChat;
  fab.onclick=function(){panel.style.display=panel.style.display==='flex'?'none':'flex';if(panel.style.display==='flex')input.focus();};
  close.onclick=function(){panel.style.display='none';};
  function ask(){
    var q=input.value.trim();if(!q||busy)return;
    input.value='';bubble(q,true);saveMsg(q,true);busy=true;
    var wait=bubble('…',false);
    fetch('/manage/ai-chat/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({message:q,history:history})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        var reply=res.ok?res.j.reply:(res.j.error||'Something went wrong.');
        wait.innerHTML=renderMd(reply);saveMsg(reply,false);
        if(res.ok){
          history.push({role:'user',content:q});
          history.push({role:'assistant',content:reply});
          if(history.length>12)history=history.slice(-12);
          sessionStorage.setItem('ai_history',JSON.stringify(history));
          if(res.j.pending_action){confirmCard(res.j.pending_action);}
        }
      })
      .catch(function(){var msg='The assistant is unavailable right now.';wait.textContent=msg;saveMsg(msg,false);})
      .finally(function(){busy=false;});
  }
  send.onclick=ask;
  input.addEventListener('keydown',function(e){if(e.key==='Enter')ask();});

  // ---- tabs (only present when both Assistant + Support are available) ----
  var tabAssistant=document.getElementById('tab-assistant'),tabSupport=document.getElementById('tab-support'),
      chatPane=document.getElementById('ai-chat-pane'),supportPane=document.getElementById('support-pane'),
      title=document.getElementById('ai-panel-title');
  function showAssistant(){
    chatPane.style.display='flex';supportPane.style.display='none';
    if(tabAssistant){tabAssistant.style.background='#f8fafc';tabAssistant.style.fontWeight='600';}
    if(tabSupport){tabSupport.style.background='#fff';tabSupport.style.fontWeight='400';}
    title.textContent="{% trans 'Emplinx Assistant' %}";
  }
  function showSupport(){
    chatPane.style.display='none';supportPane.style.display='flex';
    if(tabAssistant){tabAssistant.style.background='#fff';tabAssistant.style.fontWeight='400';}
    if(tabSupport){tabSupport.style.background='#f8fafc';tabSupport.style.fontWeight='600';}
    title.textContent="{% trans 'Support' %}";
  }
  if(tabAssistant)tabAssistant.onclick=showAssistant;
  if(tabSupport)tabSupport.onclick=showSupport;

  // ---- support: new-ticket form ----
  var subjectEl=document.getElementById('support-subject'),messageEl=document.getElementById('support-message'),
      sendSupport=document.getElementById('support-send'),statusEl=document.getElementById('support-status'),
      supportNewPane=document.getElementById('support-new'),supportThreadPane=document.getElementById('support-thread'),
      supportBusy=false;

  // ---- support: conversation thread ----
  var threadSubjectEl=document.getElementById('support-thread-subject'),
      supportMsgs=document.getElementById('support-msgs'),
      replyInput=document.getElementById('support-reply-input'),
      replySend=document.getElementById('support-reply-send'),
      newTicketLink=document.getElementById('support-new-ticket-link'),
      supportPollTimer=null,replyBusy=false;

  function supportBubble(text,fromOwner){
    var d=document.createElement('div');
    d.style.cssText='border-radius:10px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap;'+
      (fromOwner?'background:#fff;border:1px solid #e2e8f0;color:#0f172a;margin-right:20px;':'background:#4f46e5;color:#fff;margin-left:40px;');
    d.textContent=text;
    return d;
  }

  function loadThread(ticketId){
    fetch('/manage/support/thread/'+ticketId+'/')
      .then(function(r){return r.ok?r.json():null;})
      .then(function(t){
        if(!t){sessionStorage.removeItem('support_ticket_id');showNewTicketForm();return;}
        threadSubjectEl.textContent='#'+t.id+' · '+t.subject+(t.status==='resolved'?' ({% trans "resolved" %})':'');
        supportMsgs.innerHTML='';
        supportMsgs.appendChild(supportBubble(t.message,false));
        t.replies.forEach(function(r){supportMsgs.appendChild(supportBubble(r.body,r.from_owner));});
        supportMsgs.scrollTop=supportMsgs.scrollHeight;
      })
      .catch(function(){});
  }

  function showThread(ticketId){
    supportNewPane.style.display='none';supportThreadPane.style.display='flex';
    loadThread(ticketId);
    if(supportPollTimer)clearInterval(supportPollTimer);
    supportPollTimer=setInterval(function(){loadThread(ticketId);},5000);
  }

  var historyEl=document.getElementById('support-history');
  function loadHistory(){
    if(!historyEl)return;
    fetch('/manage/support/mine/')
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){
        if(!d||!d.tickets.length){historyEl.innerHTML='';return;}
        var html='<div style="font-weight:600;font-size:12px;color:#475569;margin-bottom:6px;">{% trans "Your tickets" %}</div>';
        d.tickets.forEach(function(t){
          var badge=t.status==='resolved'
            ?'<span style="background:#dcfce7;color:#166534;border-radius:9999px;padding:1px 8px;font-size:10.5px;">{% trans "Resolved" %}</span>'
            :'<span style="background:#fee2e2;color:#991b1b;border-radius:9999px;padding:1px 8px;font-size:10.5px;">{% trans "Open" %}</span>';
          html+='<div class="support-hist-item" data-tid="'+t.id+'" style="display:flex;justify-content:space-between;align-items:center;gap:6px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:7px 10px;margin-bottom:5px;cursor:pointer;">'
            +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;"><span style="color:#94a3b8;font-family:monospace;">#'+t.id+'</span> '+t.subject.replace(/&/g,'&amp;').replace(/</g,'&lt;')+(t.replies?' <span style="color:#64748b;">('+t.replies+')</span>':'')+'</span>'
            +badge+'</div>';
        });
        historyEl.innerHTML=html;
        historyEl.querySelectorAll('.support-hist-item').forEach(function(el){
          el.onclick=function(){
            sessionStorage.setItem('support_ticket_id',el.getAttribute('data-tid'));
            showThread(el.getAttribute('data-tid'));
          };
        });
      })
      .catch(function(){});
  }

  function showNewTicketForm(){
    if(supportPollTimer){clearInterval(supportPollTimer);supportPollTimer=null;}
    supportThreadPane.style.display='none';supportNewPane.style.display='flex';
    loadHistory();
  }

  if(newTicketLink)newTicketLink.onclick=function(){sessionStorage.removeItem('support_ticket_id');showNewTicketForm();};

  if(replySend){
    replySend.onclick=function(){
      var msg=replyInput.value.trim(),ticketId=sessionStorage.getItem('support_ticket_id');
      if(!msg||!ticketId||replyBusy)return;
      replyBusy=true;replySend.disabled=true;replySend.textContent='…';replySend.style.opacity='.75';
      // optimistic: show the bubble immediately, greyed until confirmed
      var pending=supportBubble(msg,false);
      pending.style.opacity='.55';
      supportMsgs.appendChild(pending);
      supportMsgs.scrollTop=supportMsgs.scrollHeight;
      replyInput.value='';
      fetch('/manage/support/reply/'+ticketId+'/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},
        body:JSON.stringify({message:msg})})
        .then(function(r){return r.ok;})
        .then(function(ok){
          if(ok){pending.style.opacity='1';loadThread(ticketId);}
          else{pending.style.opacity='1';pending.style.background='#fee2e2';pending.style.color='#991b1b';pending.textContent=msg+' — {% trans "failed, try again" %}';replyInput.value=msg;}
        })
        .catch(function(){pending.style.background='#fee2e2';pending.style.color='#991b1b';pending.style.opacity='1';replyInput.value=msg;})
        .finally(function(){replyBusy=false;replySend.disabled=false;replySend.textContent='➤';replySend.style.opacity='1';});
    };
    replyInput.addEventListener('keydown',function(e){if(e.key==='Enter')replySend.onclick();});
  }

  var sendSpinner=document.getElementById('support-send-spinner'),sendLabel=document.getElementById('support-send-label');
  function setSending(on){
    if(sendSpinner)sendSpinner.style.display=on?'inline-block':'none';
    if(sendLabel)sendLabel.textContent=on?"{% trans 'Sending...' %}":"{% trans 'Send to Support' %}";
    sendSupport.style.opacity=on?'.75':'1';
  }
  if(sendSupport){
    sendSupport.onclick=function(){
      var subject=subjectEl.value.trim(),message=messageEl.value.trim();
      if(!subject||!message||supportBusy)return;
      supportBusy=true;sendSupport.disabled=true;statusEl.textContent='';setSending(true);
      fetch('/manage/support/submit/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},
        body:JSON.stringify({subject:subject,message:message})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};}).catch(function(){return {ok:r.ok,j:{}};});})
        .then(function(res){
          if(res.ok){
            subjectEl.value='';messageEl.value='';statusEl.textContent='';
            sessionStorage.setItem('support_ticket_id',res.j.id);
            showThread(res.j.id);
          }else{
            statusEl.style.color='#dc2626';
            statusEl.textContent=res.j.error||"{% trans 'Could not send — try again.' %}";
          }
        })
        .catch(function(){statusEl.style.color='#dc2626';statusEl.textContent="{% trans 'Could not reach the server.' %}";})
        .finally(function(){supportBusy=false;sendSupport.disabled=false;setSending(false);});
    };
  }

  // resume an existing ticket's conversation on page load, else show history
  (function(){
    var existingTicketId=sessionStorage.getItem('support_ticket_id');
    if(existingTicketId && supportThreadPane)showThread(existingTicketId);
    else loadHistory();
  })();
})();
</script>
