{% load i18n %}
<div id="ai-fab" title="{% trans 'Ask Emplinx Assistant' %}"
     style="position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;
            background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;
            font-size:24px;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,.4);z-index:9998;">🤖</div>

<div id="ai-panel"
     style="display:none;position:fixed;bottom:92px;right:24px;width:340px;max-width:calc(100vw - 48px);
            height:460px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);
            z-index:9999;flex-direction:column;overflow:hidden;font-family:Inter,sans-serif;">
  <div style="background:#4f46e5;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
    <div style="font-weight:600;font-size:14px;" id="ai-panel-title">{% trans "Emplinx Assistant" %}</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="ai-clear" title="{% trans 'Clear conversation' %}" style="cursor:pointer;font-size:12px;opacity:.85;">{% trans "Clear" %}</span>
      <span id="ai-close" style="cursor:pointer;font-size:18px;">×</span>
    </div>
  </div>
  {% if ai_widget_visible and support_widget_visible %}
  <div style="display:flex;border-bottom:1px solid #e2e8f0;">
    <button type="button" id="tab-assistant" class="ai-tab-btn" style="flex:1;padding:8px;border:none;background:#f8fafc;cursor:pointer;font-weight:600;font-size:12.5px;">{% trans "Assistant" %}</button>
    <button type="button" id="tab-support" class="ai-tab-btn" style="flex:1;padding:8px;border:none;background:#fff;cursor:pointer;font-size:12.5px;">{% trans "Support" %}</button>
  </div>
  {% endif %}
  <div id="ai-chat-pane" style="display:flex;flex-direction:column;flex:1;overflow:hidden;{% if not ai_widget_visible %}display:none;{% endif %}">
    <div id="ai-msgs" style="flex:1;overflow-y:auto;padding:12px;font-size:13px;background:#f8fafc;">
    </div>
    <div style="display:flex;border-top:1px solid #e2e8f0;padding:8px;gap:6px;">
      <input id="ai-input" placeholder="{% trans 'Type your question...' %}"
             style="flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;">
      <button id="ai-send" style="background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:0 14px;cursor:pointer;">➤</button>
    </div>
  </div>
  <div id="support-pane" style="display:{% if ai_widget_visible %}none{% else %}flex{% endif %};flex-direction:column;flex:1;overflow-y:auto;padding:14px;font-size:13px;background:#f8fafc;">
    <p style="color:#64748b;font-size:12.5px;margin-bottom:10px;">{% trans "Trouble with something? Send us a message — we'll get back to you by email." %}</p>
    <input id="support-subject" placeholder="{% trans 'Subject' %}"
           style="border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;margin-bottom:8px;">
    <textarea id="support-message" placeholder="{% trans 'Describe the issue...' %}" rows="6"
              style="border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;resize:vertical;margin-bottom:8px;"></textarea>
    <button id="support-send" style="background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:9px;cursor:pointer;font-size:13px;">{% trans "Send to Support" %}</button>
    <div id="support-status" style="margin-top:8px;font-size:12.5px;"></div>
  </div>
</div>

<script>
(function(){
  var fab=document.getElementById('ai-fab'),panel=document.getElementById('ai-panel'),
      close=document.getElementById('ai-close'),msgs=document.getElementById('ai-msgs'),
      input=document.getElementById('ai-input'),send=document.getElementById('ai-send'),busy=false;
  // sessionStorage: survives page navigation within Emplinx, clears on tab close — never sent anywhere but this browser tab.
  function csrf(){var m=document.cookie.match(/csrftoken=([^;]+)/);return m?m[1]:'';}
  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  // Minimal, safe markdown-lite renderer: escape everything first, then turn
  // **bold**/*italic*/`code` into tags so the assistant's replies don't show
  // literal asterisks/backticks in the bubble.
  function renderMd(text){
    var h=escapeHtml(text);
    h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
    h=h.replace(/(^|\s)\*([^\s*][^*]*?)\*(?=$|\s)/g,'$1<em>$2</em>');
    return h;
  }
  function bubble(text,me){
    var d=document.createElement('div');
    d.style.cssText='border-radius:10px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap;'+
      (me?'background:#4f46e5;color:#fff;margin-left:40px;':'background:#fff;border:1px solid #e2e8f0;color:#0f172a;margin-right:20px;');
    if(me){d.textContent=text;}else{d.innerHTML=renderMd(text);}
    msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;
  }
  // sessionStorage: survives page navigation within Emplinx, clears when the tab closes — never sent anywhere but this browser tab.
  var GREETING="{% trans 'Hi! Ask me about your leave balance, shifts, payslips, or how to use Emplinx.' %}";
  var MAX_AGE=8*60*60*1000; // auto-expire the conversation after 8 hours
  var history=[],msgHistory=[];
  var ts=parseInt(sessionStorage.getItem('ai_ts')||'0',10);
  if(ts&&(Date.now()-ts)>MAX_AGE){sessionStorage.removeItem('ai_history');sessionStorage.removeItem('ai_msgs');sessionStorage.removeItem('ai_ts');}
  try{history=JSON.parse(sessionStorage.getItem('ai_history')||'[]');}catch(e){history=[];}
  try{msgHistory=JSON.parse(sessionStorage.getItem('ai_msgs')||'[]');}catch(e){msgHistory=[];}
  if(msgHistory.length){msgHistory.forEach(function(m){bubble(m.text,m.me);});}
  else{bubble(GREETING,false);}
  function saveMsg(text,me){
    msgHistory.push({text:text,me:me});if(msgHistory.length>40)msgHistory=msgHistory.slice(-40);
    sessionStorage.setItem('ai_msgs',JSON.stringify(msgHistory));
    sessionStorage.setItem('ai_ts',String(Date.now()));
  }
  function clearChat(){
    history=[];msgHistory=[];
    sessionStorage.removeItem('ai_history');sessionStorage.removeItem('ai_msgs');sessionStorage.removeItem('ai_ts');
    msgs.innerHTML='';bubble(GREETING,false);
  }
  document.getElementById('ai-clear').onclick=clearChat;
  fab.onclick=function(){panel.style.display=panel.style.display==='flex'?'none':'flex';if(panel.style.display==='flex')input.focus();};
  close.onclick=function(){panel.style.display='none';};
  function ask(){
    var q=input.value.trim();if(!q||busy)return;
    input.value='';bubble(q,true);saveMsg(q,true);busy=true;
    var wait=bubble('…',false);
    fetch('/manage/ai-chat/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({message:q,history:history})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        var reply=res.ok?res.j.reply:(res.j.error||'Something went wrong.');
        wait.innerHTML=renderMd(reply);saveMsg(reply,false);
        if(res.ok){
          history.push({role:'user',content:q});
          history.push({role:'assistant',content:reply});
          if(history.length>12)history=history.slice(-12);
          sessionStorage.setItem('ai_history',JSON.stringify(history));
        }
      })
      .catch(function(){var msg='The assistant is unavailable right now.';wait.textContent=msg;saveMsg(msg,false);})
      .finally(function(){busy=false;});
  }
  send.onclick=ask;
  input.addEventListener('keydown',function(e){if(e.key==='Enter')ask();});

  // ---- tabs (only present when both Assistant + Support are available) ----
  var tabAssistant=document.getElementById('tab-assistant'),tabSupport=document.getElementById('tab-support'),
      chatPane=document.getElementById('ai-chat-pane'),supportPane=document.getElementById('support-pane'),
      title=document.getElementById('ai-panel-title');
  function showAssistant(){
    chatPane.style.display='flex';supportPane.style.display='none';
    if(tabAssistant){tabAssistant.style.background='#f8fafc';tabAssistant.style.fontWeight='600';}
    if(tabSupport){tabSupport.style.background='#fff';tabSupport.style.fontWeight='400';}
    title.textContent="{% trans 'Emplinx Assistant' %}";
  }
  function showSupport(){
    chatPane.style.display='none';supportPane.style.display='flex';
    if(tabAssistant){tabAssistant.style.background='#fff';tabAssistant.style.fontWeight='400';}
    if(tabSupport){tabSupport.style.background='#f8fafc';tabSupport.style.fontWeight='600';}
    title.textContent="{% trans 'Support' %}";
  }
  if(tabAssistant)tabAssistant.onclick=showAssistant;
  if(tabSupport)tabSupport.onclick=showSupport;

  // ---- support form ----
  var subjectEl=document.getElementById('support-subject'),messageEl=document.getElementById('support-message'),
      sendSupport=document.getElementById('support-send'),statusEl=document.getElementById('support-status'),
      supportBusy=false;
  if(sendSupport){
    sendSupport.onclick=function(){
      var subject=subjectEl.value.trim(),message=messageEl.value.trim();
      if(!subject||!message||supportBusy)return;
      supportBusy=true;sendSupport.disabled=true;statusEl.textContent='';
      fetch('/manage/support/submit/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},
        body:JSON.stringify({subject:subject,message:message})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};}).catch(function(){return {ok:r.ok,j:{}};});})
        .then(function(res){
          if(res.ok){
            statusEl.style.color='#16a34a';
            statusEl.textContent="{% trans 'Sent — we\'ll get back to you by email shortly.' %}";
            subjectEl.value='';messageEl.value='';
          }else{
            statusEl.style.color='#dc2626';
            statusEl.textContent=res.j.error||"{% trans 'Could not send — try again.' %}";
          }
        })
        .catch(function(){statusEl.style.color='#dc2626';statusEl.textContent="{% trans 'Could not reach the server.' %}";})
        .finally(function(){supportBusy=false;sendSupport.disabled=false;});
    };
  }
})();
</script>
