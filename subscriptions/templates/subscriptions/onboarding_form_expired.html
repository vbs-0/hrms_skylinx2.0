<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link expired — EMPLINX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{ --ex-navy:#0d2157; --ex-bg:#f7f6ff; --ex-text:#0f0b22; }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',sans-serif;color:var(--ex-text);background:var(--ex-bg);min-height:100dvh;
      display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(13,33,87,.08);max-width:420px;width:100%;
      padding:40px 32px;text-align:center;}
    .icon{width:56px;height:56px;border-radius:50%;background:#fef2f2;color:#dc2626;display:flex;
      align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px;}
    h1{font-size:20px;color:var(--ex-navy);margin:0 0 10px;}
    p{color:#6b7280;font-size:14px;line-height:1.6;margin:0;}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&times;</div>
    <h1>This link is no longer valid</h1>
    <p>It may have already been used, or it's expired. Please reach out to whoever invited you for a fresh link.</p>
  </div>
</body>
</html>
