{% load static i18n %}
<ul class="breadcrumb ms-4" id="breadcrumbList">
    {% for breadcrumb in breadcrumbs %}
        {% if forloop.first or forloop.last %}
            <li>
                <a href="{% if breadcrumb.found %}{{ breadcrumb.url }}{% else %}#{% endif %}">{% trans breadcrumb.name %}</a>
            </li>
        {% else %}
            {% if forloop.counter == 2 and breadcrumbs|length > 2 %}
                <li>
                    <a href="#" class="breadcrumb-ellipsis"
                       onclick="event.preventDefault();this.closest('.breadcrumb').classList.add('breadcrumb--expanded');this.closest('li').remove();">…</a>
                </li>
            {% endif %}
            <li class="breadcrumb-collapsed">
                <a href="{% if breadcrumb.found %}{{ breadcrumb.url }}{% else %}#{% endif %}">{% trans breadcrumb.name %}</a>
            </li>
        {% endif %}
    {% endfor %}
</ul>
<style>
    .breadcrumb .breadcrumb-collapsed { display: none; }
    .breadcrumb--expanded .breadcrumb-collapsed { display: inline-flex; }
    /* keep breadcrumbs on one line; long segments get ellipsis instead of
       wrapping and pushing the page content down */
    #breadcrumbList {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        overflow: hidden;
        max-width: 34vw;
        white-space: nowrap;
    }
    #breadcrumbList li { flex-shrink: 0; }
    #breadcrumbList li a {
        display: inline-block;
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
    }
</style>
