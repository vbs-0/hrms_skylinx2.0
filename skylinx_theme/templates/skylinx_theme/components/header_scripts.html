<script>
    document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("themeToggleButton");
    if (!btn) return;

    btn.addEventListener("click", function (e) {
        e.preventDefault();

        // index.html has a global document-level click listener that forwards
        // clicks landing anywhere on a button (except its lone inner <a>) into
        // a synthetic .click() on that <a> — meant for plain nav links. Since
        // this button wraps exactly one <a>, any click on the button's padding
        // (not the icon itself) double-fires this handler: once for the real
        // click, once for the forwarded synthetic click on the <a>. Two toggles
        // cancel out, so the theme flips and then flips right back. Stop the
        // event here so it never reaches that document-level listener.
        e.stopPropagation();

        // A page-wide "self-heal" watchdog (index.html) force-reloads on ANY
        // htmx swap settling if the header looks momentarily empty — totally
        // unrelated to this toggle, but its reload can land mid-flight and
        // re-render the header from the OLD server session, snapping the
        // icon/theme back right after the click. Block it for the duration
        // of this request so the toggle can never be raced.
        window.__themeToggling = true;

        fetch("{% url 'toggle_theme' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "X-Requested-With": "XMLHttpRequest"
        }
        })
        .then(response => {
        if (response.status === 204) {
            // Since server stored the new theme, we just mirror it in the UI

            const isDark = document.documentElement.classList.toggle("dark");
            document.body.classList.toggle("dark", isDark);

            const icon = btn.querySelector("i");
            if (icon) {
            icon.classList.toggle("fa-moon", !isDark);
            icon.classList.toggle("fa-lightbulb", isDark);
            }
        }
        })
        .catch(err => console.error(err))
        .finally(function () { window.__themeToggling = false; });
    });
    });
</script>
