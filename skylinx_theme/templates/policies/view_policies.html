{% extends 'index.html' %}
{% load i18n  static %}

{% block content %}
    <div hx-get="{% url 'policy-nav' %}" hx-trigger="load"></div>

    {% if perms.employee.add_policy %}
        <div style="text-align:right;margin:8px 0;">
            <a href="{% url 'policy-acceptance-status' %}" class="oh-btn oh-btn--secondary">
                <ion-icon name="checkmark-done-outline"></ion-icon> {% trans "Acceptance status" %}
            </a>
        </div>
    {% endif %}

    <button
        type="button"
        id="policyContainerReload"
        hidden
        hx-get="{% url 'search-policies' %}"
        hx-target="#policyContainer"
        hx-swap="innerHTML"
    ></button>

    <div class="oh-wrapper" id="policyContainer"></div>
{% endblock %}
