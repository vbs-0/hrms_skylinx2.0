{% load static %} {% load i18n %}
<div class="oh-wrapper" data-select2-id="select2-data-40-yu7x">
    <div class="oh-general__tab-target oh-profile-section mb-4 p-5" id="personal" data-select2-id="select2-data-personal" style="border:none;">
        <div class="oh-profile-section__card p-10" data-select2-id="select2-data-48-0df8" style="border:1px solid #cdd5df; border-radius:10px;">
            {% include 'employee/update_form/edit_form_back_button.html' %}
            <form
                method="post"
                enctype="multipart/form-data"
                hx-post="{% url 'employee-view-update' obj_id %}"
                hx-target="#employee-update-form-root"
                hx-swap="outerHTML"
                {% if not container_mode %}hx-push-url="{% url 'employee-view-update' obj_id %}"{% endif %}
                hx-encoding="multipart/form-data"
                action="{% url 'employee-view-update' obj_id %}"
            >
                <div id="personalMessage"></div>
                <input type="hidden" name="form" value="personal">
                {% csrf_token %}
                {% if container_mode %}<input type="hidden" name="container" value="true">{% endif %}
                <div class="row">
                    <div class="col-12 col-sm-12 col-md-12 col-lg-6 d-flex align-items-center">
                        <div class="oh-profile-section__edit-photo me-4 mb-3" data-toggle="oh-modal-toggle"
                            data-target="#uploadPhotoModal">
                            <img src="{{form.instance.get_avatar}}" class="oh-profile-section__avatar preview"
                                alt="Username" />
                        </div>
                    </div>
                    {{form.employee_profile.errors}}
                </div>
                <div class="row">
                    <div class="col-12 col-sm-12 col-md-12 col-lg-6">
                        <label class="oh-label" for="{{form.badge_id.id_for_label}}">{% trans "Employee ID" %}</label>
                        {{form.badge_id}} {{form.badge_id.errors}}
                    </div>
                </div>
                {{form.as_p}}
                <hr class="mt-5 mb-3" style="color:#cdd5df;">
                <div class="w-100 d-flex" style="justify-content: flex-end;">
                    <button type="submit" class="oh-btn oh-btn--secondary oh-btn--w-100-resp">
                        {% trans "Save" %}
                    </button>
                </div>
            </form>
        </div>
    </div>
    <div class="oh-modal" id="uploadPhotoModal" role="dialog" aria-labelledby="uploadPhotoModal" aria-hidden="true">
        <div class="oh-modal__dialog">
            <div class="oh-modal__dialog-header">
                <span class="oh-modal__dialog-title" id="uploadPhotoModalLabel">{% trans "Upload Photo" %}</span>
                <button class="oh-modal__close" aria-label="Close" onclick="$(this).closest('.oh-modal--show').removeClass('oh-modal--show');">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
            <div class="oh-modal__dialog-body" id="uploadPhotoModalBody">
                <div class="oh-profile-section__image-container">
                    <form id="file-form">
                        <div id="cropStage" style="width:200px;height:200px;border-radius:50%;overflow:hidden;
                             position:relative;margin:0 auto;background:#f1f5f9;cursor:grab;touch-action:none;">
                            <img id="cropImg" class="preview" src="{{form.instance.get_avatar}}" alt="Username"
                                 style="position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;
                                        pointer-events:none;max-width:none;" />
                        </div>
                        <input type="range" id="cropZoom" min="100" max="300" value="100"
                               style="width:200px;display:none;margin:10px auto 0;" />
                        <input type="file" id="id_employee_profile_source" accept="image/*"
                            class="oh-input oh-input--file oh-input--file-sm mt-4" />
                        {% csrf_token %}
                        <div class="d-flex justify-content-between w-100 align-items-center mt-4">
                            <button class="oh-btn oh-btn--light-danger mr-1"
                                hx-delete="{% url 'remove-profile-image' obj_id %}"
                                hx-target="#personalMessage">
                                <ion-icon class="me-1" name="trash-outline"></ion-icon>
                                {% trans "Delete Image" %}
                            </button>
                            <button type="submit" class="oh-btn oh-btn--secondary oh-btn--shadow">
                                {% trans "Update Image" %}
                            </button>
                        </div>
                        <script>
                            $(document).ready(function () {
                                var stage = document.getElementById("cropStage");
                                var img = document.getElementById("cropImg");
                                var zoomSlider = document.getElementById("cropZoom");
                                var STAGE = 200;
                                var natural = { w: 0, h: 0 };
                                var baseScale = 1;
                                var pos = { x: 0, y: 0 };
                                var drag = null;

                                function applyTransform() {
                                    var scale = baseScale * (zoomSlider.value / 100);
                                    img.style.width = (natural.w * scale) + "px";
                                    img.style.height = (natural.h * scale) + "px";
                                    img.style.left = pos.x + "px";
                                    img.style.top = pos.y + "px";
                                }
                                function clampPos(scale) {
                                    var w = natural.w * scale, h = natural.h * scale;
                                    pos.x = Math.min(0, Math.max(STAGE - w, pos.x));
                                    pos.y = Math.min(0, Math.max(STAGE - h, pos.y));
                                }
                                function loadIntoCropper(url) {
                                    var probe = new Image();
                                    probe.onload = function () {
                                        natural.w = probe.naturalWidth;
                                        natural.h = probe.naturalHeight;
                                        baseScale = STAGE / Math.min(natural.w, natural.h);
                                        zoomSlider.value = 100;
                                        zoomSlider.style.display = "block";
                                        pos.x = (STAGE - natural.w * baseScale) / 2;
                                        pos.y = (STAGE - natural.h * baseScale) / 2;
                                        img.src = url;
                                        applyTransform();
                                    };
                                    probe.src = url;
                                }

                                $("#id_employee_profile_source").change(function () {
                                    var file = this.files[0];
                                    if (!file) return;
                                    var reader = new FileReader();
                                    reader.addEventListener("load", function () {
                                        loadIntoCropper(reader.result);
                                    });
                                    reader.readAsDataURL(file);
                                });

                                zoomSlider.addEventListener("input", function () {
                                    var scale = baseScale * (zoomSlider.value / 100);
                                    clampPos(scale);
                                    applyTransform();
                                });

                                function startDrag(x, y) {
                                    if (!natural.w) return;
                                    drag = { x: x, y: y, startX: pos.x, startY: pos.y };
                                    stage.style.cursor = "grabbing";
                                }
                                function moveDrag(x, y) {
                                    if (!drag) return;
                                    pos.x = drag.startX + (x - drag.x);
                                    pos.y = drag.startY + (y - drag.y);
                                    clampPos(baseScale * (zoomSlider.value / 100));
                                    applyTransform();
                                }
                                function endDrag() {
                                    drag = null;
                                    stage.style.cursor = "grab";
                                }
                                stage.addEventListener("mousedown", function (e) { startDrag(e.clientX, e.clientY); });
                                window.addEventListener("mousemove", function (e) { moveDrag(e.clientX, e.clientY); });
                                window.addEventListener("mouseup", endDrag);
                                stage.addEventListener("touchstart", function (e) {
                                    var t = e.touches[0]; startDrag(t.clientX, t.clientY);
                                });
                                stage.addEventListener("touchmove", function (e) {
                                    var t = e.touches[0]; moveDrag(t.clientX, t.clientY); e.preventDefault();
                                }, { passive: false });
                                stage.addEventListener("touchend", endDrag);

                                function buildCroppedBlob(callback) {
                                    if (!natural.w) { callback(null); return; }
                                    var scale = baseScale * (zoomSlider.value / 100);
                                    var OUT = 400;
                                    var canvas = document.createElement("canvas");
                                    canvas.width = OUT;
                                    canvas.height = OUT;
                                    var ctx = canvas.getContext("2d");
                                    var sx = -pos.x / scale, sy = -pos.y / scale;
                                    var sSize = STAGE / scale;
                                    ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, OUT, OUT);
                                    canvas.toBlob(function (blob) { callback(blob); }, "image/jpeg", 0.92);
                                }

                                $("#file-form").submit(function (e) {
                                    e.preventDefault();
                                    var form = this;
                                    buildCroppedBlob(function (blob) {
                                        var formData = new FormData(form);
                                        if (blob) {
                                            formData.append("employee_profile", blob, "profile.jpg");
                                        }
                                        $.ajax({
                                            url: '{% url "update-profile-image" obj_id %}',
                                            type: "POST",
                                            data: formData,
                                            cache: false,
                                            contentType: false,
                                            processData: false,
                                            success: function (response) {
                                                $("#uploadPhotoModalBody").html(response);
                                            },
                                            error: function (xhr, status, error) {
                                                // console.log(xhr.responseText);
                                            },
                                        });
                                    });
                                    return false;
                                });
                            });
                        </script>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
